name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: shellcheck install.sh

      - name: Prettier check (JSON / YAML)
        run: npx --yes prettier --check "package.json" "*.yml"

      - name: bash syntax check
        run: bash -n install.sh

  test-dsh:
    name: Test dsh profile boots
    runs-on: ubuntu-latest
    env:
      DSH_HOME: /tmp/dsh-home
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Show pnpm version
        run: pnpm --version

      - name: Install profile via install.sh (worktree)
        run: ./install.sh web --mode worktree --branch ci-web --force

      - name: Verify dsh can compose the profile
        run: npx --yes @deepseek-ai/dsh@next --profile web --dump-config > /tmp/dump.yml

      - name: Show composed profile
        run: cat /tmp/dump.yml

      - name: Boot web server and probe it
        working-directory: ${{ env.DSH_HOME }}/profiles/web
        env:
          DSH_PORT: "3099"
        run: |
          npx --yes @deepseek-ai/dsh@next --profile web --host 127.0.0.1 --port "$DSH_PORT" --no-open > /tmp/dsh-boot.log 2>&1 &
          BOOT_PID=$!
          trap 'kill "$BOOT_PID" 2>/dev/null || true' EXIT

          code=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$DSH_PORT" || true)"
            if [ "$code" = "200" ]; then
              echo "Server responded 200 after ${i}s"
              break
            fi
            # Fail fast if the process died
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then
              echo "Server process exited early" >&2
              break
            fi
            sleep 1
          done

          echo "--- boot log ---"
          cat /tmp/dsh-boot.log

          if [ "$code" != "200" ]; then
            echo "::error::web server did not respond with 200 (last code: $code)"
            exit 1
          fi

          if grep -nE '(^|[][[:space:]('"'"'])[Ee]rror(s)?([\]:.,[:space:]]|$)|\[[Ee][Rr][Rr][Oo][Rr]\]|FATAL|Traceback' /tmp/dsh-boot.log; then
            echo "::error::errors found in boot log"
            exit 1
          fi

          kill "$BOOT_PID"
          wait "$BOOT_PID" 2>/dev/null || true

  e2e:
    name: Playwright functional test
    runs-on: ubuntu-latest
    env:
      DSH_HOME: /tmp/dsh-home-e2e
      DSH_PORT: "3100"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Show pnpm version
        run: pnpm --version

      - name: Install profile via install.sh (worktree)
        run: ./install.sh web --mode worktree --branch ci-e2e --force

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start dsh web server
        working-directory: ${{ env.DSH_HOME }}/profiles/web
        run: |
          npx --yes @deepseek-ai/dsh@next --profile web --host 127.0.0.1 --port "$DSH_PORT" --no-open > /tmp/dsh-e2e.log 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$DSH_PORT" || true)"
            if [ "$code" = "200" ]; then
              echo "Server responded 200 after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::dsh web server did not respond with 200 (last code: $code)"
            cat /tmp/dsh-e2e.log
            exit 1
          fi

      - name: Run Playwright smoke tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Stop dsh web server
        if: always()
        run: |
          kill "$PID" 2>/dev/null || true
          pkill -f "dsh --profile web --host 127.0.0.1 --port $DSH_PORT" 2>/dev/null || true

      - name: Show dsh boot log on failure
        if: failure()
        run: cat /tmp/dsh-e2e.log
