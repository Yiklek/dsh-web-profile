name: Update dependencies

on:
  push:
    branches: [main]
  schedule:
    # 03:00 Beijing time (19:00 UTC previous day)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Check if push merges an automation PR
        id: check
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const after = context.sha;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'closed',
              base: 'main',
              per_page: 100,
              sort: 'updated',
              direction: 'desc',
            });
            const merged = pulls.find(
              (pr) => pr.merged_at && pr.merge_commit_sha === after && pr.head.ref.startsWith('bot/dependency-updates-')
            );
            return merged ? 'true' : 'false';

      - name: Skip when merging an automation PR
        if: github.event_name == 'push' && steps.check.outputs.result == 'true'
        run: |
          echo "Skipping: this push merges a dependency-update automation PR"
          exit 0

      - name: Update profile dependencies
        run: pnpm update

      - name: Update e2e dependencies
        working-directory: tests/e2e
        run: pnpm update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push dependency updates
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="bot/dependency-updates-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(deps): update dependencies"
          git push --force origin "$BRANCH"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = process.env.BRANCH;

            // Close older automation PRs from previous runs so only one stays open.
            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            for (const pr of openPulls) {
              if (pr.head.repo?.full_name === `${owner}/${repo}` && pr.head.ref.startsWith('bot/dependency-updates-')) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  state: 'closed',
                });
                console.log(`Closed old PR #${pr.number}`);
              }
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore(deps): update dependencies',
              head,
              base: 'main',
              body: [
                'Automated dependency update by GitHub Actions.',
                '',
                '- `pnpm update` at repo root',
                '- `pnpm update` in `tests/e2e`',
                '',
                'CI will validate the changes.',
              ].join('\n'),
            });
            console.log(`Created PR #${pr.number}`);
