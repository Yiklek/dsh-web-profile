name: Update dependencies

on:
  push:
    branches: [main]
  schedule:
    # 03:00 Beijing time (19:00 UTC previous day)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/github-script@v9
        id: check
        with:
          result-encoding: string
          script: |
            // Non-push triggers (schedule/manual) always run.
            if (github.event_name !== 'push') {
              return 'true';
            }
            const { owner, repo } = context.repo;
            const after = github.event.after || context.sha;
            console.log(`check: event=${github.event_name} after=${after}`);
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'closed',
              base: 'main',
              per_page: 100,
              sort: 'updated',
              direction: 'desc',
            });
            const merged = pulls.find(
              (pr) => pr.merged_at && pr.merge_commit_sha === after && pr.head.ref.startsWith('bot/dependency-updates-')
            );
            if (merged) {
              console.log(`check: merged automation PR #${merged.number} ${merged.head.ref}`);
            }
            const shouldRun = merged ? 'false' : 'true';
            console.log(`check: should_run=${shouldRun}`);
            return shouldRun;

  update:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Update profile dependencies
        run: pnpm update

      - name: Update e2e dependencies
        working-directory: tests/e2e
        run: pnpm update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            CHANGED=false
          else
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "changes: changed=$CHANGED"

      - name: Commit and push dependency updates
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="bot/dependency-updates-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit: branch=$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(deps): update dependencies"
          git push --force origin "$BRANCH"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = process.env.BRANCH;

            // Close older automation PRs from previous runs so only one stays open.
            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            for (const pr of openPulls) {
              if (pr.head.repo?.full_name === `${owner}/${repo}` && pr.head.ref.startsWith('bot/dependency-updates-')) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  state: 'closed',
                });
                console.log(`Closed old PR #${pr.number}`);
              }
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore(deps): update dependencies',
              head,
              base: 'main',
              body: [
                'Automated dependency update by GitHub Actions.',
                '',
                '- `pnpm update` at repo root',
                '- `pnpm update` in `tests/e2e`',
                '',
                'CI will validate the changes.',
              ].join('\n'),
            });
            console.log(`Created PR #${pr.number}`);
