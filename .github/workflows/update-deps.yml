name: Update dependencies

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/github-script@v9
        id: check
        with:
          result-encoding: json
          script: |
            // Non-push triggers (schedule/manual) always run.
            if (context.eventName !== 'push') {
              return 'true';
            }
            const { owner, repo } = context.repo;
            core.info(`check: event=${context.eventName} sha=${context.sha}`);
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              base: 'main',
              per_page: 100,
              sort: 'updated',
              direction: 'desc',
            });
            const merged = pulls.find(
              (pr) => pr.merged_at && pr.merge_commit_sha === context.sha && pr.head.ref.startsWith('bot/dependency-updates-')
            );
            if (merged) {
              core.info(`check: merged automation PR #${merged.number} ${merged.head.ref}`);
            }
            const shouldRun = merged ? 'false' : 'true';
            core.info(`check: should_run=${shouldRun}`);
            return shouldRun;

      - name: Clean stale bot dependency-update branches
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            // Branches attached to open PRs must be preserved.
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const openBranches = new Set(
              openPulls
                .filter((pr) => pr.head.ref.startsWith('bot/dependency-updates-'))
                .map((pr) => pr.head.ref)
            );
            core.info(`open bot branch(es): ${openBranches.size}`);

            // All remote bot/dependency-updates refs.
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: 'heads/bot/dependency-updates-',
            });
            for (const item of refs) {
              const branch = item.ref.replace('refs/heads/', '');
              if (openBranches.has(branch)) {
                core.info(`keeping open ${branch}`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`deleted ${branch}`);
              } catch (error) {
                core.info(`failed to delete ${branch}: ${error.status} ${error.message}`);
                if (error.status !== 422) throw error;
              }
            }

  update:
    needs: check
    # Manual dispatch must always run the dependency update; push/schedule runs
    # are gated by the check job's result. `always()` keeps the manual guarantee
    # even if the check job fails (e.g. stale-branch cleanup error).
    if: always() && (github.event_name == 'workflow_dispatch' || fromJSON(needs.check.outputs.should_run) == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Update profile dependencies
        run: pnpm update --latest

      - name: Update e2e dependencies
        working-directory: tests/e2e
        run: pnpm update --latest

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            CHANGED=false
          else
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "changes: changed=$CHANGED"

      - name: Generate bump message
        if: steps.changes.outputs.changed == 'true'
        run: |
          node <<'NODE' > "$RUNNER_TEMP/bump-summary.txt"
          const fs = require('fs');
          const { execSync } = require('child_process');

          function allDeps(pkg) {
            return {
              ...(pkg.dependencies || {}),
              ...(pkg.devDependencies || {}),
              ...(pkg.optionalDependencies || {}),
              ...(pkg.peerDependencies || {}),
            };
          }

          function clean(v) {
            return v == null ? v : String(v).replace(/^[~^>=]+/, '');
          }

          const files = [
            { prefix: '', path: 'package.json' },
            { prefix: 'tests/e2e ', path: 'tests/e2e/package.json' },
          ];
          const lines = [];
          for (const { prefix, path } of files) {
            const oldPkg = JSON.parse(execSync(`git show HEAD:${path}`, { encoding: 'utf8' }));
            const newPkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            const oldDeps = allDeps(oldPkg);
            const newDeps = allDeps(newPkg);
            for (const name of [...new Set([...Object.keys(oldDeps), ...Object.keys(newDeps)])].sort()) {
              const oldV = oldDeps[name];
              const newV = newDeps[name];
              if (oldV !== newV) {
                lines.push(`- bump ${prefix}${name} from ${clean(oldV)} to ${clean(newV)}`);
              }
            }
          }
          console.log(lines.join('\n'));
          NODE
          cat "$RUNNER_TEMP/bump-summary.txt"

      - name: Commit and push dependency updates
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="bot/dependency-updates-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit: branch=$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          if [ -s "$RUNNER_TEMP/bump-summary.txt" ]; then
            if [ "$(wc -l < "$RUNNER_TEMP/bump-summary.txt")" -eq 1 ]; then
              SUBJECT="chore(deps): $(sed 's/^- //' "$RUNNER_TEMP/bump-summary.txt")"
            else
              SUBJECT="chore(deps): update dependencies"
            fi
            git commit -m "$SUBJECT" -m "$(cat "$RUNNER_TEMP/bump-summary.txt")"
          else
            git commit -m "chore(deps): update dependencies"
          fi
          git push --force origin "$BRANCH"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = process.env.BRANCH;

            // Close older automation PRs from previous runs so only one stays open.
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            for (const pr of openPulls) {
              if (pr.head.ref.startsWith('bot/dependency-updates-')) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  state: 'closed',
                });
                core.info(`Closed old PR #${pr.number}`);
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${pr.head.ref}`,
                  });
                  core.info(`Deleted old branch ${pr.head.ref}`);
                } catch (error) {
                  core.info(`delete old branch failed for ${pr.head.ref}: ${error.status} ${error.message}`);
                  if (error.status !== 422) throw error;
                }
              }
            }

            const { readFileSync } = await import('fs');
            let summary = '';
            try {
              summary = readFileSync(`${process.env.RUNNER_TEMP}/bump-summary.txt`, 'utf8');
            } catch {}
            const bumpLines = summary.split('\n').filter((line) => line.trim() !== '');

            let title = 'chore(deps): update dependencies';
            if (bumpLines.length === 1) {
              title = `chore(deps): ${bumpLines[0].replace(/^- /, '')}`;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base: 'main',
              body: [
                'Automated dependency update by GitHub Actions.',
                '',
                ...(bumpLines.length > 0 ? bumpLines : ['No dependency version changes detected.']),
                '',
                'CI will validate the changes.',
              ].join('\n'),
            });
            core.info(`Created PR #${pr.number}`);
